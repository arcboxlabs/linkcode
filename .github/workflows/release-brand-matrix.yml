name: Release Brand Matrix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact client ref to build
        type: string
        required: true
      matrix_file:
        description: Reviewed matrix under .github/release/brand-matrices; required for builds
        type: string
        required: false
        default: ""
      matrix_json:
        description: Uncommitted matrix JSON for plan validation only
        type: string
        required: false
        default: ""
      build:
        description: Render and build every brand/platform target
        type: boolean
        required: true
        default: false
      sign:
        description: Sign/notarize desktop and mobile artifacts
        type: boolean
        required: true
        default: false
      upload:
        description: Upload only after every signed artifact and provenance gate succeeds
        type: boolean
        required: true
        default: false

concurrency:
  group: release-brand-matrix-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  prepare:
    name: Validate matrix
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      brands: ${{ steps.matrix.outputs.brands }}
      delivery_descriptor_sha256: ${{ steps.matrix.outputs.delivery_descriptor_sha256 }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Validate request shape
        env:
          CLIENT_REF: ${{ inputs.ref }}
          MATRIX_FILE: ${{ inputs.matrix_file }}
          MATRIX_JSON: ${{ inputs.matrix_json }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CLIENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be an exact lowercase 40-hex client commit"
            exit 1
          fi
          if [ "$CLIENT_REF" != "$WORKFLOW_SHA" ]; then
            echo "::error::ref must equal github.sha so workflow code, release-environment policy, and built client use one commit"
            exit 1
          fi
          if ${{ (inputs.sign && !inputs.build) || (inputs.upload && !inputs.sign) }}; then
            echo "::error::sign requires build=true and upload requires sign=true"
            exit 1
          fi
          if { [ -z "$MATRIX_FILE" ] && [ -z "$MATRIX_JSON" ]; } || { [ -n "$MATRIX_FILE" ] && [ -n "$MATRIX_JSON" ]; }; then
            echo "::error::provide exactly one of matrix_file or matrix_json"
            exit 1
          fi
          if [ -n "$MATRIX_JSON" ] && ${{ inputs.build }}; then
            echo "::error::matrix_json is plan-only; builds require a reviewed matrix_file"
            exit 1
          fi
          if [ -n "$MATRIX_FILE" ] && [[ ! "$MATRIX_FILE" =~ ^\.github/release/brand-matrices/[a-z0-9][a-z0-9._-]*\.json$ ]]; then
            echo "::error::matrix_file must be a JSON file directly under .github/release/brand-matrices"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify trusted client checkout
        env:
          CLIENT_REF: ${{ inputs.ref }}
          MATRIX_FILE: ${{ inputs.matrix_file }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLIENT_REF"
          if ! git merge-base --is-ancestor "$CLIENT_REF" refs/remotes/origin/master; then
            echo "::error::ref must be a commit already reachable from protected master"
            exit 1
          fi
          if [ -n "$MATRIX_FILE" ]; then
            entry="$(git ls-tree "$CLIENT_REF" -- "$MATRIX_FILE")"
            if [[ "$entry" != '100644 blob '* ]]; then
              echo "::error::matrix_file must be a regular file committed at ref"
              exit 1
            fi
            git cat-file blob "$CLIENT_REF:$MATRIX_FILE" > "$RUNNER_TEMP/committed-brand-matrix.json"
          fi

      - name: Build strict matrix plan
        id: matrix
        env:
          MATRIX_FILE: ${{ inputs.matrix_file }}
          MATRIX_JSON: ${{ inputs.matrix_json }}
        run: |
          set -euo pipefail
          if [ -n "$MATRIX_JSON" ]; then
            matrix_file="$RUNNER_TEMP/brand-build-matrix.json"
            printf '%s' "$MATRIX_JSON" > "$matrix_file"
          else
            matrix_file="$RUNNER_TEMP/committed-brand-matrix.json"
          fi
          node .github/scripts/brand-matrix.cjs \
            --matrix-file "$matrix_file" \
            --build "${{ inputs.build }}" \
            --sign "${{ inputs.sign }}" \
            --upload "${{ inputs.upload }}"

  credential-free-validation:
    name: Credential-free ${{ matrix.brandId }}/${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Exercise Electron recovery with Xvfb
        if: ${{ matrix.platform == 'desktop' }}
        run: |
          set -euo pipefail
          pnpm -F @linkcode/desktop exec playwright-core install-deps chromium
          printf '%s  %s\n' \
            '54ce1fc855e12295a8dd1490463c9afac8e84a526f1e16340bcefe4f0fec8e39' \
            'apps/desktop/e2e/fixtures/pilot-e2e-v1.json' | sha256sum --check --strict
          xvfb-run -a pnpm -F @linkcode/desktop e2e:config-canary
      - name: Exercise production Hermes and native generation
        if: ${{ matrix.platform != 'desktop' }}
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          pnpm -F @linkcode/mobile smoke:export
          pnpm --dir apps/mobile exec expo prebuild --clean --no-install --platform '${{ matrix.platform }}'
          if [ '${{ matrix.platform }}' = android ]; then
            test -f apps/mobile/android/app/build.gradle
            rm -rf apps/mobile/android
          else
            test -f apps/mobile/ios/Podfile
            rm -rf apps/mobile/ios
          fi
      - name: Record local-only evidence
        env:
          BRAND_ID: ${{ matrix.brandId }}
          CLIENT_REF: ${{ inputs.ref }}
          DELIVERY_SHA256: ${{ needs.prepare.outputs.delivery_descriptor_sha256 }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p credential-free-evidence
          if [ "$PLATFORM" = desktop ]; then
            runtime=electron+xvfb
          else
            runtime=production-hermes+prebuild
          fi
          jq -cn \
            --arg brandId "$BRAND_ID" \
            --arg clientGitSha "$CLIENT_REF" \
            --arg deliveryDescriptorSha256 "$DELIVERY_SHA256" \
            --arg platform "$PLATFORM" \
            --arg runtime "$runtime" \
            '{brandId:$brandId,clientGitSha:$clientGitSha,deliveryDescriptorSha256:$deliveryDescriptorSha256,deploymentIdentity:{kind:"local-static-origin",providerDeploymentId:null},evidenceVersion:1,pilotFixtureSha256:"54ce1fc855e12295a8dd1490463c9afac8e84a526f1e16340bcefe4f0fec8e39",platform:$platform,runtime:$runtime}' \
            > credential-free-evidence/runtime-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: credential-free-${{ matrix.brandId }}-${{ matrix.platform }}
          path: credential-free-evidence
          if-no-files-found: error
          retention-days: 7

  release-environment-preflight:
    name: Protected live-pilot preflight
    if: ${{ inputs.build }}
    needs: prepare
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Require protected nonproduction release environment
        env:
          GH_TOKEN: ${{ secrets.PILOT_ENVIRONMENT_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PILOT_ENVIRONMENT_ADMIN_TOKEN is required to inspect environment protection"
            exit 1
          fi
          environment="$RUNNER_TEMP/pilot-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/pilot-nonproduction" > "$environment"
          if ! jq -e '
            .name == "pilot-nonproduction" and
            ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | any(. > 0)) and
            (.deployment_branch_policy != null) and
            (.deployment_branch_policy.protected_branches == true or .deployment_branch_policy.custom_branch_policies == true)
          ' "$environment" >/dev/null; then
            echo "::error::pilot-nonproduction must require reviewers and a deployment branch policy before a live pilot"
            exit 1
          fi

  render-inputs:
    name: Validate immutable render inputs
    if: ${{ inputs.build }}
    needs: [prepare, release-environment-preflight]
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    env:
      CONFIG_PUBLISHER_REPO: ${{ vars.CONFIG_PUBLISHER_REPO }}
      CONFIG_PUBLISHER_TOKEN: ${{ secrets.CONFIG_PUBLISHER_TOKEN }}
      CONFIG_RELEASE_KEYRINGS: ${{ vars.CONFIG_RELEASE_KEYRINGS }}
      CONFIG_RELEASE_REVISION: ${{ vars.CONFIG_RELEASE_REVISION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - run: node .github/scripts/release-inputs.cjs --phase render --platform desktop

  signing-inputs:
    name: Validate signing inputs
    if: ${{ inputs.sign }}
    needs: [prepare, release-environment-preflight]
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    env:
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
      SENTRY_DSN_MOBILE: ${{ secrets.SENTRY_DSN_MOBILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - run: node .github/scripts/release-inputs.cjs --phase sign --platform desktop
      - run: node .github/scripts/release-inputs.cjs --phase sign --platform mobile
      - if: ${{ inputs.upload }}
        run: node .github/scripts/release-inputs.cjs --phase upload --platform mobile

  render:
    name: Render ${{ matrix.brandId }}
    if: ${{ inputs.build }}
    needs: [prepare, render-inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Render desktop bundle and identity
        uses: ./.github/actions/render-release-config
        with:
          app: desktop
          brand-artifacts: true
          publisher-repo: ${{ vars.CONFIG_PUBLISHER_REPO }}
          publisher-token: ${{ secrets.CONFIG_PUBLISHER_TOKEN }}
          revision: ${{ vars.CONFIG_RELEASE_REVISION }}
          keyrings: ${{ vars.CONFIG_RELEASE_KEYRINGS }}
          release-manifest: ${{ toJSON(matrix.releaseManifests.desktop) }}

      - name: Render mobile bundles and identities
        uses: ./.github/actions/render-release-config
        with:
          app: mobile
          publisher-repo: ${{ vars.CONFIG_PUBLISHER_REPO }}
          publisher-token: ${{ secrets.CONFIG_PUBLISHER_TOKEN }}
          revision: ${{ vars.CONFIG_RELEASE_REVISION }}
          keyrings: ${{ vars.CONFIG_RELEASE_KEYRINGS }}
          release-manifest-ios: ${{ toJSON(matrix.releaseManifests.ios) }}
          release-manifest-android: ${{ toJSON(matrix.releaseManifests.android) }}

      - name: Stage immutable release inputs
        env:
          COMPLIANCE_ANDROID: ${{ toJSON(matrix.compliance.android) }}
          COMPLIANCE_DESKTOP: ${{ toJSON(matrix.compliance.desktop) }}
          COMPLIANCE_IOS: ${{ toJSON(matrix.compliance.ios) }}
          CLIENT_REF: ${{ inputs.ref }}
          MATRIX_FILE: ${{ inputs.matrix_file }}
          MANIFEST_ANDROID: ${{ toJSON(matrix.releaseManifests.android) }}
          MANIFEST_DESKTOP: ${{ toJSON(matrix.releaseManifests.desktop) }}
          MANIFEST_IOS: ${{ toJSON(matrix.releaseManifests.ios) }}
          MOBILE_DISTRIBUTION: ${{ toJSON(matrix.distribution.mobile) }}
        run: |
          set -euo pipefail
          mkdir release-inputs
          git cat-file blob "$CLIENT_REF:$MATRIX_FILE" > release-inputs/brand-build-matrix.json
          cp "$RUNNER_TEMP/config-render-desktop/source/packages/config-structural/brands.manifest.yaml" release-inputs/
          printf '%s' "$MANIFEST_DESKTOP" > release-inputs/release-manifest.desktop.json
          printf '%s' "$MANIFEST_IOS" > release-inputs/release-manifest.ios.json
          printf '%s' "$MANIFEST_ANDROID" > release-inputs/release-manifest.android.json
          printf '%s' "$COMPLIANCE_DESKTOP" > release-inputs/compliance.desktop.json
          printf '%s' "$COMPLIANCE_IOS" > release-inputs/compliance.ios.json
          printf '%s' "$COMPLIANCE_ANDROID" > release-inputs/compliance.android.json
          if [ "$MOBILE_DISTRIBUTION" != null ]; then
            jq -cn \
              --arg brand '${{ matrix.brandId }}' \
              --arg channel '${{ matrix.channel }}' \
              --argjson distribution "$MOBILE_DISTRIBUTION" \
              '$distribution + {brandId: $brand, channel: $channel, mobileReleaseFormatVersion: 1}' \
              > apps/mobile/generated/mobile-release.json
            cp apps/mobile/generated/mobile-release.json release-inputs/
          fi

      - name: Gate rendered defaults and store compliance
        run: |
          set -euo pipefail
          mkdir release-inputs/preflight
          for platform in desktop ios android; do
            printf 'validated=%s/%s\n' '${{ matrix.brandId }}' "$platform" \
              > "release-inputs/preflight/${platform}.txt"
            if [ "$platform" = desktop ]; then
              bundle=apps/desktop/generated/config-build-bundle.json
              identity=apps/desktop/generated/brand-identity.json
            else
              bundle="apps/mobile/src/runtime/config/bundled.generated.${platform}.ts"
              identity="apps/mobile/generated/brand-identity.${platform}.json"
            fi
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root release-inputs/preflight \
              --artifact "${platform}.txt" \
              --bundle "$bundle" \
              --brand-identity "$identity" \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --release-manifest "release-inputs/release-manifest.${platform}.json" \
              --compliance "release-inputs/compliance.${platform}.json" \
              --out "${platform}.provenance.json"
          done

      - name: Upload isolated rendered inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: brand-render-${{ matrix.brandId }}
          path: |
            apps/desktop/generated
            apps/mobile/generated
            apps/mobile/src/runtime/config/bundled.generated.ios.ts
            apps/mobile/src/runtime/config/bundled.generated.android.ts
            release-inputs
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop ${{ matrix.brandId }}
    if: ${{ inputs.build && !cancelled() && needs.render.result == 'success' && (needs.signing-inputs.result == 'success' || needs.signing-inputs.result == 'skipped') }}
    needs: [prepare, render, signing-inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ inputs.ref }}
      sign: ${{ inputs.sign }}
      brand_id: ${{ matrix.brandId }}
      delivery_descriptor_sha256: ${{ needs.prepare.outputs.delivery_descriptor_sha256 }}
      release_environment: pilot-nonproduction
      rendered_artifact: brand-render-${{ matrix.brandId }}
      update_url: ${{ matrix.distribution.desktop.updateUrl || '' }}

  desktop-validation:
    name: Desktop validation ${{ matrix.brandId }}
    if: ${{ inputs.build && !inputs.sign && !cancelled() && needs.render.result == 'success' }}
    needs: [prepare, render]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Electron system dependencies
        run: pnpm -F @linkcode/desktop exec playwright-core install-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: brand-render-${{ matrix.brandId }}
          path: .
      - name: Verify real Electron configuration recovery
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '54ce1fc855e12295a8dd1490463c9afac8e84a526f1e16340bcefe4f0fec8e39' \
            'apps/desktop/e2e/fixtures/pilot-e2e-v1.json' | sha256sum --check --strict
          rendered="$RUNNER_TEMP/rendered-desktop-${{ matrix.brandId }}"
          mv apps/desktop/generated "$rendered"
          status=0
          xvfb-run -a pnpm -F @linkcode/desktop e2e:config-canary || status=$?
          if [ -e apps/desktop/generated ]; then
            echo "::error::the fixture build created release-rendered output"
            exit 1
          fi
          mv "$rendered" apps/desktop/generated
          exit "$status"
      - name: Record isolated validation evidence
        run: |
          set -euo pipefail
          root="release-validation/${{ matrix.brandId }}"
          mkdir -p "$root"
          printf '%s\n' '{"activationVersions":{"emergency":["1","2","3"],"normal":["1","2","3","4"]},"consumer":"desktop","deploymentIdentity":{"kind":"local-static-origin","providerDeploymentId":null},"drills":["emergency-kill-switch","emergency-release","offline-startup","pointer-and-snapshot-tamper","replay-rejection","rollback","roll-forward"],"evidenceVersion":1,"pilotFixtureSha256":"54ce1fc855e12295a8dd1490463c9afac8e84a526f1e16340bcefe4f0fec8e39","runtime":"electron+xvfb"}' \
            > "$root/validation.desktop.json"
          pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
            --artifact-root "$root" \
            --artifact validation.desktop.json \
            --bundle apps/desktop/generated/config-build-bundle.json \
            --brand-identity apps/desktop/generated/brand-identity.json \
            --brand-manifest release-inputs/brands.manifest.yaml \
            --client-git-sha '${{ inputs.ref }}' \
            --delivery-descriptor release-inputs/brand-build-matrix.json \
            --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
            --release-manifest release-inputs/release-manifest.desktop.json \
            --compliance release-inputs/compliance.desktop.json \
            --out release-provenance.desktop.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: brand-validation-desktop-${{ matrix.brandId }}
          path: release-validation/${{ matrix.brandId }}
          if-no-files-found: error
          retention-days: 7

  mobile-validation:
    name: Mobile validation ${{ matrix.brandId }}
    if: ${{ inputs.build && !inputs.sign && !cancelled() && needs.render.result == 'success' }}
    needs: [prepare, render]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-eas
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: brand-render-${{ matrix.brandId }}
          path: .
      - name: Verify production Hermes exports
        run: pnpm -F @linkcode/mobile smoke:export
      - name: Verify credential-free native generation
        working-directory: apps/mobile
        run: |
          CI=1 EXPO_NO_TELEMETRY=1 pnpm exec expo prebuild --clean --no-install --platform android
          test -f android/app/build.gradle
          rm -rf android
          CI=1 EXPO_NO_TELEMETRY=1 pnpm exec expo prebuild --clean --no-install --platform ios
          test -f ios/Podfile
      - name: Record isolated validation evidence
        run: |
          mkdir -p "release-validation/${{ matrix.brandId }}"
          for platform in ios android; do
            printf '%s=production-hermes+prebuild\n' "$platform" \
              > "release-validation/${{ matrix.brandId }}/validation.${platform}.txt"
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root "release-validation/${{ matrix.brandId }}" \
              --artifact "validation.${platform}.txt" \
              --bundle "apps/mobile/src/runtime/config/bundled.generated.${platform}.ts" \
              --brand-identity "apps/mobile/generated/brand-identity.${platform}.json" \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --release-manifest "release-inputs/release-manifest.${platform}.json" \
              --compliance "release-inputs/compliance.${platform}.json" \
              --out "release-provenance.${platform}.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: brand-validation-${{ matrix.brandId }}
          path: release-validation/${{ matrix.brandId }}
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Mobile ${{ matrix.brandId }}
    if: ${{ inputs.sign && !cancelled() && needs.render.result == 'success' && needs.signing-inputs.result == 'success' }}
    needs: [prepare, render, signing-inputs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    uses: ./.github/workflows/build-mobile.yml
    with:
      ref: ${{ inputs.ref }}
      brand_id: ${{ matrix.brandId }}
      delivery_descriptor_sha256: ${{ needs.prepare.outputs.delivery_descriptor_sha256 }}
      release_environment: pilot-nonproduction
      rendered_artifact: brand-render-${{ matrix.brandId }}
      submit: false

  publish-preflight:
    name: Publish preflight ${{ matrix.brandId }}
    if: ${{ inputs.upload && !cancelled() && needs.desktop.result == 'success' && needs.mobile.result == 'success' }}
    needs: [prepare, desktop, mobile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets[format('{0}_R2_ACCESS_KEY_ID', matrix.distribution.desktop.credentialSecretPrefix)] }}
      R2_ACCOUNT_ID: ${{ secrets[format('{0}_R2_ACCOUNT_ID', matrix.distribution.desktop.credentialSecretPrefix)] }}
      R2_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_R2_SECRET_ACCESS_KEY', matrix.distribution.desktop.credentialSecretPrefix)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate every upload credential
        run: |
          set -euo pipefail
          node .github/scripts/release-inputs.cjs --phase upload --platform desktop
          node .github/scripts/release-inputs.cjs --phase upload --platform mobile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: brand-render-${{ matrix.brandId }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-${{ matrix.brandId }}-*
          merge-multiple: true
          path: publish-preflight/${{ matrix.brandId }}/desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mobile-${{ matrix.brandId }}-*
          merge-multiple: true
          path: publish-preflight/${{ matrix.brandId }}/mobile
      - name: Re-hash every signed artifact and immutable binding
        run: |
          set -euo pipefail
          for runner_platform in mac win linux; do
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root "publish-preflight/${{ matrix.brandId }}/desktop" \
              --verify "publish-preflight/${{ matrix.brandId }}/desktop/release-provenance.${runner_platform}.json" \
              --bundle apps/desktop/generated/config-build-bundle.json \
              --brand-identity apps/desktop/generated/brand-identity.json \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --expected-brand '${{ matrix.brandId }}' \
              --expected-platform desktop \
              --release-manifest release-inputs/release-manifest.desktop.json \
              --signed
          done
          for platform in ios android; do
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root "publish-preflight/${{ matrix.brandId }}/mobile" \
              --verify "publish-preflight/${{ matrix.brandId }}/mobile/release-provenance.${platform}.json" \
              --bundle "apps/mobile/src/runtime/config/bundled.generated.${platform}.ts" \
              --brand-identity "apps/mobile/generated/brand-identity.${platform}.json" \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --expected-brand '${{ matrix.brandId }}' \
              --expected-platform "$platform" \
              --release-manifest "release-inputs/release-manifest.${platform}.json" \
              --signed
          done

  publish-mobile:
    name: Publish mobile ${{ matrix.brandId }}
    if: ${{ inputs.upload && !cancelled() && needs.desktop.result == 'success' && needs.mobile.result == 'success' && needs.publish-preflight.result == 'success' }}
    needs: [prepare, desktop, mobile, publish-preflight]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-eas
      - run: pnpm install --frozen-lockfile
      - name: Validate upload inputs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node .github/scripts/release-inputs.cjs --phase upload --platform mobile
      - name: Fetch brand release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: brand-render-${{ matrix.brandId }}
          path: .
      - name: Fetch signed mobile artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mobile-${{ matrix.brandId }}-*
          merge-multiple: true
          path: artifacts/${{ matrix.brandId }}
      - name: Require provenance and apply internal-store destinations
        run: |
          set -euo pipefail
          for platform in ios android; do
            test -s "artifacts/${{ matrix.brandId }}/release-provenance.${platform}.json"
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root "artifacts/${{ matrix.brandId }}" \
              --verify "artifacts/${{ matrix.brandId }}/release-provenance.${platform}.json" \
              --bundle "apps/mobile/src/runtime/config/bundled.generated.${platform}.ts" \
              --brand-identity "apps/mobile/generated/brand-identity.${platform}.json" \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --expected-brand '${{ matrix.brandId }}' \
              --expected-platform "$platform" \
              --release-manifest "release-inputs/release-manifest.${platform}.json" \
              --signed
          done
          release=release-inputs/mobile-release.json
          asc_app_id="$(jq -er .ios.ascAppId "$release")"
          apple_team_id="$(jq -er .ios.appleTeamId "$release")"
          android_track="$(jq -er .android.track "$release")"
          ios_bundle_id="$(jq -er .applicationId apps/mobile/generated/brand-identity.ios.json)"
          tmp="$(mktemp)"
          jq --arg asc "$asc_app_id" --arg team "$apple_team_id" --arg track "$android_track" --arg bundle "$ios_bundle_id" \
            '.submit.production.ios.ascAppId = $asc
             | .submit.production.ios.appleTeamId = $team
             | .submit.production.ios.bundleIdentifier = $bundle
             | del(.submit.production.ios.metadataPath)
             | .submit.production.android.track = $track' \
            apps/mobile/eas.json > "$tmp"
          mv "$tmp" apps/mobile/eas.json
      - name: Submit only to TestFlight and Play internal
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas submit --platform ios --profile production \
            --path "$GITHUB_WORKSPACE/artifacts/${{ matrix.brandId }}/linkcode-ios.ipa" \
            --non-interactive --wait
          eas submit --platform android --profile production \
            --path "$GITHUB_WORKSPACE/artifacts/${{ matrix.brandId }}/linkcode-android.aab" \
            --non-interactive --wait

  publish-desktop:
    name: Publish desktop ${{ matrix.brandId }}
    if: ${{ inputs.upload && !cancelled() && needs.desktop.result == 'success' && needs.mobile.result == 'success' && needs.publish-preflight.result == 'success' }}
    needs: [prepare, desktop, mobile, publish-preflight]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.brands) }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: pilot-nonproduction
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}_R2_ACCESS_KEY_ID', matrix.distribution.desktop.credentialSecretPrefix)] }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_R2_SECRET_ACCESS_KEY', matrix.distribution.desktop.credentialSecretPrefix)] }}
      R2_ACCOUNT_ID: ${{ secrets[format('{0}_R2_ACCOUNT_ID', matrix.distribution.desktop.credentialSecretPrefix)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate upload inputs
        env:
          R2_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: node .github/scripts/release-inputs.cjs --phase upload --platform desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: brand-render-${{ matrix.brandId }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-${{ matrix.brandId }}-*
          merge-multiple: true
          path: artifacts/${{ matrix.brandId }}
      - name: Require per-platform provenance
        run: |
          set -euo pipefail
          for platform in mac win linux; do
            test -s "artifacts/${{ matrix.brandId }}/release-provenance.${platform}.json"
            pnpm exec tsx packages/foundation/common/src/node/release-artifact-cli.mts \
              --artifact-root "artifacts/${{ matrix.brandId }}" \
              --verify "artifacts/${{ matrix.brandId }}/release-provenance.${platform}.json" \
              --bundle apps/desktop/generated/config-build-bundle.json \
              --brand-identity apps/desktop/generated/brand-identity.json \
              --brand-manifest release-inputs/brands.manifest.yaml \
              --client-git-sha '${{ inputs.ref }}' \
              --delivery-descriptor release-inputs/brand-build-matrix.json \
              --expected-delivery-sha256 '${{ needs.prepare.outputs.delivery_descriptor_sha256 }}' \
              --expected-brand '${{ matrix.brandId }}' \
              --expected-platform desktop \
              --release-manifest release-inputs/release-manifest.desktop.json \
              --signed
          done
      - name: Upload only this brand prefix
        env:
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          aws s3 sync "artifacts/${{ matrix.brandId }}/" \
            "s3://${{ matrix.distribution.desktop.r2Bucket }}/${{ matrix.distribution.desktop.r2Prefix }}/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
