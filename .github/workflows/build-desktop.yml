# Reusable build workflow for the Electron desktop app (@linkcode/desktop).
#
# PR builds stay unsigned (forks get no secrets). `sign: true` — the release flow — signs and
# notarizes inside the protected `release` environment, which holds all signing secrets.
# Windows Trusted Signing authenticates via OIDC federation (azure/login); no client secret exists.

name: Build Desktop

on:
  # Invoked by release-desktop.yml (caller must use `secrets: inherit`).
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false
        default: ""
      sign:
        description: Sign and notarize the build
        type: boolean
        required: false
        default: false
  # CI builds on PRs — unsigned.
  # pull_request:
  #   paths:
  #     - "apps/desktop/**"
  #     - "packages/**"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the build
        type: boolean
        default: false

concurrency:
  group: build-desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # OIDC token for azure/login (signed Windows builds); unused on PR builds

env:
  DESKTOP_DIR: apps/desktop
  DESKTOP_PACKAGE: "@linkcode/desktop" # name in package.json (used by `pnpm turbo --filter`)
  OUTPUT_DIR: apps/desktop/release # must match electron-builder `directories.output`

  # Trusted Signing identifiers — not credentials, but kept as `release` environment secrets so
  # the public repo doesn't advertise the signing infrastructure.
  AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }} # must match the certificate subject CN exactly
  AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
  AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
  AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}

  # Signed builds must embed the rendered immutable config bundle: the Vite main build and
  # verify-artifacts both fail when it is absent instead of shipping empty defaults.
  LINKCODE_REQUIRE_CONFIG_BUNDLE: ${{ inputs.sign && '1' || '' }}

jobs:
  # Renders the immutable config bundle from the pinned config publisher checkout (release
  # environment holds the pins and the publisher read token). Unsigned builds skip this and
  # build without a bundle; signed builds hard-require its output.
  render-config:
    name: Render immutable config
    if: ${{ inputs.sign }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render config bundle
        uses: ./.github/actions/render-release-config
        with:
          app: desktop
          publisher-repo: ${{ vars.CONFIG_PUBLISHER_REPO }}
          publisher-token: ${{ secrets.CONFIG_PUBLISHER_TOKEN }}
          revision: ${{ vars.CONFIG_RELEASE_REVISION }}
          keyrings: ${{ vars.CONFIG_RELEASE_KEYRINGS }}
          release-manifest: ${{ vars.CONFIG_RELEASE_MANIFEST_DESKTOP }}

      - name: Upload rendered bundle
        uses: actions/upload-artifact@v7
        with:
          name: desktop-config-bundle
          path: apps/desktop/generated/config-build-bundle.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs: render-config
    # render-config self-skips on unsigned builds; only a real failure blocks the build.
    if: ${{ !cancelled() && (needs.render-config.result == 'success' || needs.render-config.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    # Signing is gated by the `release` environment (secrets + tag policy); '' = no environment.
    environment: ${{ inputs.sign && 'release' || '' }}
    strategy:
      fail-fast: false
      # Runners resolve through repo/org `vars` (ArcBox pins Blacksmith labels there); forks
      # fall back to GitHub-hosted images. Whatever the source, each platform keeps its floor:
      # mac needs arm64 + Xcode 26 (actool >= 26 compiles mac.icon into Assets.car), windows
      # needs VS Build Tools (enough for NSIS), linux stays on 22.04-era glibc so AppImages
      # stay broadly compatible.
      matrix:
        include:
          - os: ${{ vars.CI_RUNNER_MACOS || 'macos-26' }}
            platform: mac
          - os: ${{ vars.CI_RUNNER_WINDOWS || 'windows-2025' }}
            platform: win
          - os: ${{ vars.CI_RUNNER_LINUX_PACKAGING || 'ubuntu-22.04' }}
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - parallel:
          # electron-builder versions artifacts and the updater feed from package.json, not the git
          # tag — a stale version would ship a release that updaters can't order correctly.
          - name: Assert package version matches release tag
            if: ${{ inputs.sign && startsWith(github.ref, 'refs/tags/v') }}
            shell: bash
            run: |
              version="$(jq -r .version "${DESKTOP_DIR}/package.json")"
              if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
                echo "::error::${DESKTOP_DIR}/package.json version (${version}) does not match tag (${GITHUB_REF_NAME})"
                exit 1
              fi

          - uses: pnpm/action-setup@v6
            with:
              run_install: false
              cache: true

          - uses: actions/setup-node@v6
            with:
              node-version-file: .nvmrc
              package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The exact bytes rendered by render-config: Vite validates them, derives the inlined
      # bootstrap, and stages them into the asar; verify-artifacts byte-compares the staged copy.
      - name: Fetch rendered config bundle
        if: ${{ inputs.sign }}
        uses: actions/download-artifact@v8
        with:
          name: desktop-config-bundle
          path: apps/desktop/generated

      - parallel:
          - name: Build workspace
            run: pnpm turbo run build --filter "${{ env.DESKTOP_PACKAGE }}..."
            env:
              # Publishable identifiers inlined only into signed release bundles. These names must
              # stay declared in apps/desktop/turbo.json `build.env` so Turbo cache keys include them.
              MAIN_VITE_SENTRY_DSN: ${{ inputs.sign && secrets.SENTRY_DSN_DESKTOP || '' }}
              RENDERER_VITE_POSTHOG_PROJECT_TOKEN: ${{ inputs.sign && secrets.POSTHOG_PROJECT_TOKEN || '' }}
              RENDERER_VITE_POSTHOG_HOST: ${{ inputs.sign && secrets.POSTHOG_HOST || '' }}

          # The PTY sidecar ships per arch under Resources (extraResources: sidecar/${arch}).
          - name: Build PTY sidecar (both arches)
            uses: ./.github/actions/build-sidecar

      # OIDC exchange for Windows Trusted Signing; Invoke-TrustedSigning (spawned by
      # electron-builder below) picks it up via DefaultAzureCredential's Azure CLI entry.
      - name: Azure login (Trusted Signing, OIDC)
        if: ${{ runner.os == 'Windows' && inputs.sign }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      # notarytool authenticates with an App Store Connect API key. electron-builder passes
      # APPLE_API_KEY straight through as a .p8 *file path* (not content), so materialize the
      # base64-encoded secret to a temp file the packaging step points at.
      - name: Materialize App Store Connect API key (.p8)
        if: ${{ runner.os == 'macOS' && inputs.sign }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"

      - name: Package with electron-builder
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: bash # unify quoting across runners for the conditional signing args below
        # package-app.mts materializes one CPU-scoped staging dir per target arch and points
        # electron-builder's --projectDir at it (see the script header). azureSignOptions is
        # forwarded via -c only on signed Windows builds so unsigned builds skip signing.
        run: |
          # electron-builder treats a *set but empty* CSC_LINK as a certificate path and dies on
          # "<projectDir> not a file". Actions cannot conditionally unset an env key, so the cert
          # lands under MACOS_* names and CSC_* only exist when there is a real value.
          if [ -n "$MACOS_CSC_LINK" ]; then
            export CSC_LINK="$MACOS_CSC_LINK" CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
          fi
          if [ "${{ matrix.platform }}" = linux ]; then
            # Electron 43 needs Clang 15; the arm64 rebuild also needs an explicit cross target.
            CC=clang-15 CXX=clang++-15 \
              node scripts/package-app.mts linux --x64 --publish never
            CC='clang-15 --target=aarch64-linux-gnu' \
              CXX='clang++-15 --target=aarch64-linux-gnu' \
              node scripts/package-app.mts linux --arm64 --publish never
          else
            node scripts/package-app.mts ${{ matrix.platform }} --publish never \
              ${{ (runner.os == 'Windows' && inputs.sign) && format('-c.win.azureSignOptions.publisherName="{0}" -c.win.azureSignOptions.endpoint="{1}" -c.win.azureSignOptions.codeSigningAccountName="{2}" -c.win.azureSignOptions.certificateProfileName="{3}"', env.AZURE_PUBLISHER_NAME, env.AZURE_SIGN_ENDPOINT, env.AZURE_CODE_SIGNING_ACCOUNT, env.AZURE_CERTIFICATE_PROFILE) || '' }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing (Developer ID cert) + notarization (App Store Connect API key).
          # APPLE_API_KEY is the .p8 path written by the step above; ID/ISSUER identify the key.
          # CSC_* are exported by the run script only when non-empty — see the comment there.
          MACOS_CSC_LINK: ${{ (runner.os == 'macOS' && inputs.sign) && secrets.MACOS_CSC_LINK || '' }}
          MACOS_CSC_KEY_PASSWORD: ${{ (runner.os == 'macOS' && inputs.sign) && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ (runner.os == 'macOS' && inputs.sign) && format('{0}/apple_api_key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ (runner.os == 'macOS' && inputs.sign) && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ (runner.os == 'macOS' && inputs.sign) && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
          # Stop macOS from signing with random keychain identities on unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && inputs.sign) && 'true' || 'false' }}

          # Windows auth comes from the azure/login step — deliberately no AZURE_* credential env
          # here, so DefaultAzureCredential falls through to the CLI entry.

      # Post-pack invariants: per-arch artifact set complete, arch markers in every name
      # (electron-updater routes by them), feed sha512s match the files on disk.
      - name: Verify packaged artifacts
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: bash
        run: node scripts/verify-artifacts.mts ${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          # *.yml + *.blockmap are the electron-updater feed — do not drop them. builder-debug.yml
          # is electron-builder's debug dump and must not ship.
          path: |
            ${{ env.OUTPUT_DIR }}/*.dmg
            ${{ env.OUTPUT_DIR }}/*.zip
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/*.msi
            ${{ env.OUTPUT_DIR }}/*.appx
            ${{ env.OUTPUT_DIR }}/*.AppImage
            ${{ env.OUTPUT_DIR }}/*.deb
            ${{ env.OUTPUT_DIR }}/*.rpm
            ${{ env.OUTPUT_DIR }}/*.snap
            ${{ env.OUTPUT_DIR }}/*.yml
            ${{ env.OUTPUT_DIR }}/*.blockmap
            !${{ env.OUTPUT_DIR }}/builder-debug.yml
