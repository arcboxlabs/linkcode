name: Render release config
description: >
  Renders the immutable build-time config bundle for a signed release. Checks out the config
  publisher and structural source at the exact commits pinned by the release manifest(s), then
  invokes the app's config:render through the pinned checkout. Every input is explicit: a missing
  value fails the build with an actionable error, and nothing is fetched from a mutable ref.

inputs:
  app:
    description: Which app to render for (desktop or mobile)
    required: true
  publisher-token:
    description: Short-lived Contents read token restricted to arcboxlabs/linkcodehq
    required: true
  source-token:
    description: Short-lived Contents read token restricted to arcboxlabs/linkcode-config
    required: true
  source-root:
    description: Reviewed source root (repository root for production or examples/acme-zenith)
    required: false
    default: "."
  revision:
    description: Config revision metadata JSON content (vars.CONFIG_RELEASE_REVISION)
    required: false
    default: ""
  keyrings:
    description: Public keyrings JSON content (vars.CONFIG_RELEASE_KEYRINGS)
    required: false
    default: ""
  brand-artifacts:
    description: Render the desktop brand identity, assets, and builder overlay
    required: false
    default: "false"
  release-manifest:
    description: Desktop release-render manifest JSON content (app == desktop)
    required: false
    default: ""
  release-manifest-ios:
    description: iOS release-render manifest JSON content (app == mobile)
    required: false
    default: ""
  release-manifest-android:
    description: Android release-render manifest JSON content (app == mobile)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Render config bundle from pinned publisher checkout
      shell: bash
      env:
        APP: ${{ inputs.app }}
        PUBLISHER_TOKEN: ${{ inputs.publisher-token }}
        SOURCE_TOKEN: ${{ inputs.source-token }}
        SOURCE_ROOT: ${{ inputs.source-root }}
        REVISION_JSON: ${{ inputs.revision }}
        KEYRINGS_JSON: ${{ inputs.keyrings }}
        MANIFEST_DESKTOP: ${{ inputs.release-manifest }}
        MANIFEST_IOS: ${{ inputs.release-manifest-ios }}
        MANIFEST_ANDROID: ${{ inputs.release-manifest-android }}
        BRAND_ARTIFACTS: ${{ inputs.brand-artifacts }}
      run: |
        set -euo pipefail

        if [ -z "$PUBLISHER_TOKEN" ] || [ -z "$SOURCE_TOKEN" ]; then
          echo "::error::render-release-config requires separate short-lived Contents read tokens for arcboxlabs/linkcodehq and arcboxlabs/linkcode-config"
          exit 1
        fi

        missing=()
        [ -n "$REVISION_JSON" ] || missing+=(CONFIG_RELEASE_REVISION)
        [ -n "$KEYRINGS_JSON" ] || missing+=(CONFIG_RELEASE_KEYRINGS)
        case "$APP" in
          desktop) [ -n "$MANIFEST_DESKTOP" ] || missing+=(CONFIG_RELEASE_MANIFEST_DESKTOP) ;;
          mobile)
            [ -n "$MANIFEST_IOS" ] || missing+=(CONFIG_RELEASE_MANIFEST_IOS)
            [ -n "$MANIFEST_ANDROID" ] || missing+=(CONFIG_RELEASE_MANIFEST_ANDROID)
            ;;
          *) echo "::error::render-release-config: unknown app '$APP'"; exit 1 ;;
        esac
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Release builds embed an immutable config bundle rendered from the pinned config publisher checkout, but these release-environment inputs are missing: ${missing[*]}. Configure them in the GitHub 'release' environment (see docs/RELEASE.md, 'Immutable config bundle')."
          exit 1
        fi

        work="$RUNNER_TEMP/config-render-$APP"
        mkdir -p "$work"
        printf '%s' "$REVISION_JSON" > "$work/revision.json"
        printf '%s' "$KEYRINGS_JSON" > "$work/keyrings.json"

        pin() { jq -er "$2" "$1"; }
        # Validated at top level before any $(pin …) use: inside command substitution a failure
        # would be swallowed (stdout captured; exit only leaves the subshell).
        check_manifest() {
          for field in .publisherGitSha .sourceGitSha .brandId .channel .telemetryEndpoint; do
            if ! pin "$1" "$field" > /dev/null; then
              echo "::error::Release manifest $1 is missing or has a null field: $field"
              exit 1
            fi
          done
        }

        if [ "$APP" = desktop ]; then
          printf '%s' "$MANIFEST_DESKTOP" > "$work/manifest-desktop.json"
          check_manifest "$work/manifest-desktop.json"
          primary="$work/manifest-desktop.json"
        else
          printf '%s' "$MANIFEST_IOS" > "$work/manifest-ios.json"
          printf '%s' "$MANIFEST_ANDROID" > "$work/manifest-android.json"
          check_manifest "$work/manifest-ios.json"
          check_manifest "$work/manifest-android.json"
          primary="$work/manifest-ios.json"
          # Both mobile targets must pin identical commits, target identity, and endpoint —
          # they render in one invocation from one pair of checkouts.
          for field in .publisherGitSha .sourceGitSha .brandId .channel .telemetryEndpoint; do
            if [ "$(pin "$work/manifest-ios.json" "$field")" != "$(pin "$work/manifest-android.json" "$field")" ]; then
              echo "::error::iOS and Android release manifests disagree on $field; both targets must render from the same pinned inputs"
              exit 1
            fi
          done
        fi

        publisher_sha="$(pin "$primary" .publisherGitSha)"
        source_sha="$(pin "$primary" .sourceGitSha)"
        brand="$(pin "$primary" .brandId)"
        channel="$(pin "$primary" .channel)"
        telemetry="$(pin "$primary" .telemetryEndpoint)"
        if [[ ! "$publisher_sha" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::publisherGitSha and sourceGitSha must be exact lowercase 40-hex commits"
          exit 1
        fi

        # Repository identities and source root are code-owned; release data controls only SHAs.
        publisher_repo=arcboxlabs/linkcodehq
        source_repo=arcboxlabs/linkcode-config
        case "$SOURCE_ROOT" in
          .|examples/acme-zenith) ;;
          *) echo "::error::source-root must be the production repository root or the reviewed nonproduction example root"; exit 1 ;;
        esac
        publisher="$work/publisher"
        source="$work/source"

        checkout_pinned() {
          local dir="$1" repo="$2" sha="$3" token="$4" label="$5"
          local auth
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          git init -q "$dir"
          git -C "$dir" remote add origin "https://github.com/${repo}.git"
          if ! git -C "$dir" -c "http.https://github.com/.extraheader=$auth" \
              -c http.followRedirects=false \
              fetch -q --depth 1 origin "$sha"; then
            echo "::error::Could not fetch $label commit $sha from $repo. Confirm the org App is installed on that private repository with Contents: read and the commit exists."
            exit 1
          fi
          git -C "$dir" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$dir" rev-parse HEAD)" != "$sha" ] || \
             [ "$(git -C "$dir" remote get-url origin)" != "https://github.com/${repo}.git" ]; then
            echo "::error::$label checkout identity did not match fixed repository $repo at $sha"
            exit 1
          fi
        }

        checkout_pinned "$publisher" "$publisher_repo" "$publisher_sha" "$PUBLISHER_TOKEN" publisher
        checkout_pinned "$source" "$source_repo" "$source_sha" "$SOURCE_TOKEN" "config source"

        structural="$source/$SOURCE_ROOT"
        if [ ! -f "$structural/brands.manifest.yaml" ] || \
           [ ! -f "$structural/schema/config.schema.json" ]; then
          echo "::error::Pinned config source must contain source root $SOURCE_ROOT with its manifest and schema mirror; production root is intentionally unavailable until reviewed production data exists"
          exit 1
        fi
        if find "$structural" -type l -print -quit | grep -q .; then
          echo "::error::Pinned config source root must not contain symbolic links"
          exit 1
        fi
        if ! cmp -s \
            "$publisher/packages/config-structural/schema/config.schema.json" \
            "$structural/schema/config.schema.json"; then
          echo "::error::Config source schema mirror differs byte-for-byte from the canonical schema at publisher commit $publisher_sha"
          exit 1
        fi

        pnpm --dir "$publisher" install --frozen-lockfile

        common_args=(
          --publisher "$publisher"
          --publisher-git-sha "$publisher_sha"
          --structural "$structural"
          --source-git-sha "$source_sha"
          --revision "$work/revision.json"
          --keyrings "$work/keyrings.json"
          --brand "$brand"
          --channel "$channel"
          --telemetry-endpoint "$telemetry"
        )
        if [ "$APP" = desktop ]; then
          brand_args=()
          if [ "$BRAND_ARTIFACTS" = true ]; then
            brand_args=(--brand-artifacts)
          elif [ "$BRAND_ARTIFACTS" != false ]; then
            echo "::error::brand-artifacts must be true or false"
            exit 1
          fi
          pnpm -F @linkcode/desktop config:render "${common_args[@]}" \
            --release-manifest "$work/manifest-desktop.json" "${brand_args[@]}"
        else
          pnpm -F @linkcode/mobile config:render "${common_args[@]}" \
            --release-manifest-ios "$work/manifest-ios.json" \
            --release-manifest-android "$work/manifest-android.json"
        fi
